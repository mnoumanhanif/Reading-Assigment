name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate HTML & Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check HTML files exist
        run: |
          echo "Checking for HTML source files..."
          test -f src/pca-practical-implementation.html && echo "✅ pca-practical-implementation.html found" || (echo "❌ pca-practical-implementation.html missing" && exit 1)
          test -f src/pca-interactive-guide.html && echo "✅ pca-interactive-guide.html found" || (echo "❌ pca-interactive-guide.html missing" && exit 1)

      - name: Validate HTML structure
        run: |
          echo "Validating HTML structure..."
          for file in src/*.html; do
            echo "Checking $file..."
            if grep -q "<html" "$file" && grep -q "</html>" "$file"; then
              echo "✅ $file has valid HTML structure"
            else
              echo "❌ $file has invalid HTML structure"
              exit 1
            fi
          done

      - name: Check documentation files
        run: |
          echo "Checking required documentation files..."
          test -f README.md && echo "✅ README.md found" || (echo "❌ README.md missing" && exit 1)
          test -f LICENSE && echo "✅ LICENSE found" || (echo "❌ LICENSE missing" && exit 1)
          test -f CONTRIBUTING.md && echo "✅ CONTRIBUTING.md found" || (echo "❌ CONTRIBUTING.md missing" && exit 1)
          test -f CHANGELOG.md && echo "✅ CHANGELOG.md found" || (echo "❌ CHANGELOG.md missing" && exit 1)
          test -f requirements.txt && echo "✅ requirements.txt found" || (echo "❌ requirements.txt missing" && exit 1)

      - name: Verify project structure
        run: |
          echo "Verifying project structure..."
          test -d src && echo "✅ src/ directory exists" || (echo "❌ src/ directory missing" && exit 1)
          test -d docs && echo "✅ docs/ directory exists" || (echo "❌ docs/ directory missing" && exit 1)
          echo "✅ Project structure is valid"
